```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCIENCE BLASTER | Mission Intro</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#030817;
    color:white;
    overflow:hidden;
}

/* INTRO SCREEN */
.intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
    radial-gradient(circle at center,#1a3c73 0%,#07142c 45%,#02040b 100%);
}

/* CONTENT */
.content{
    max-width:900px;
    padding:30px;
}

/* LOGO */
.logo{
    font-size:clamp(48px,9vw,110px);
    font-weight:900;
    margin:0;
    letter-spacing:4px;
    text-shadow:
    0 0 10px #00d9ff,
    0 0 30px #0077ff,
    0 0 60px #6a00ff;
}

.subtitle{
    font-size:clamp(16px,2vw,24px);
    color:#00e5ff;
    margin-top:15px;
    letter-spacing:3px;
}

/* MISSION */
.mission{
    margin-top:30px;
    color:#dce7ff;
    line-height:1.8;
    font-size:clamp(16px,2vw,21px);
}

/* START BUTTON */
.start-btn{
    margin-top:35px;
    padding:18px 50px;
    border:none;
    border-radius:50px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(90deg,#ff6a00,#ffcc00);
    box-shadow:
    0 0 20px rgba(255,150,0,.8),
    0 0 40px rgba(255,80,0,.4);
    transition:.3s;
}

.start-btn:hover{
    transform:scale(1.08);
}

.start-btn:active{
    transform:scale(.98);
}

/* VIDEO SCREEN */
#videoScreen{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
}

/* VIDEO */
#gameVideo{
    width:100%;
    height:100%;
    border:none;
}

/* SKIP BUTTON */
#skipBtn{
    position:absolute;
    top:20px;
    right:20px;
    z-index:100;
    padding:12px 22px;
    border-radius:30px;
    background:rgba(0,0,0,.7);
    color:white;
    font-weight:bold;
    cursor:pointer;
    border:1px solid #00d9ff;
}

/* FOOTER */
.footer{
    position:absolute;
    bottom:20px;
    font-size:13px;
    color:#7d8aa5;
}
</style>
</head>

<body>

<!-- INTRO SCREEN -->
<div class="intro" id="introScreen">

    <div class="content">

        <h1 class="logo">🚀 SCIENCE BLASTER</h1>

        <div class="subtitle">
            THE ULTIMATE SCIENCE ADVENTURE
        </div>

        <div class="mission">
            🌳 EXPLORE 5 EXCITING WORLDS<br>
            🧠 SOLVE SCIENCE CHALLENGES<br>
            🔫 SHOOT • ANSWER • LEARN • WIN!<br>
            💎 COLLECT SCIENCE CRYSTALS
        </div>

        <button class="start-btn" onclick="startMission()">
            ▶ START MISSION
        </button>

    </div>

    <div class="footer">
        SCIENCE BLASTER © 2026
    </div>

</div>


<!-- VIDEO SCREEN -->
<div id="videoScreen">

    <button id="skipBtn" onclick="skipIntro()">
        SKIP INTRO ⏭
    </button>

    <iframe
        id="gameVideo"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>


<script>

function startMission(){

    document.getElementById("introScreen").style.display="none";

    document.getElementById("videoScreen").style.display="block";

    /* GANTIKAN VIDEO_ID DENGAN ID VIDEO YOUTUBE */
    document.getElementById("gameVideo").src =
    "https://www.youtube.com/embed/6URw9WfnPe4?autoplay=1&mute=0&playsinline=1&rel=0";

}

function skipIntro(){

    /* TERUS MASUK KE GAME */
    window.location.href="game.html";

}

</script>

</body>
</html>
```
