```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCIENCE BLASTER | Mission Intro</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#08111f;
    color:#ffffff;
    overflow:hidden;
}

/* MAIN INTRO */
.intro{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at top, #17355f 0%, #0b1728 45%, #050a12 100%);
}

/* CONTENT */
.content{
    width:min(90%, 700px);
    padding:40px 25px;
}

/* SMALL SCIENCE ICON */
.icon{
    font-size:42px;
    margin-bottom:18px;
    filter:drop-shadow(0 0 12px rgba(0,210,255,.45));
}

/* GAME TITLE */
.logo{
    font-size:clamp(38px, 6vw, 72px);
    font-weight:800;
    letter-spacing:2px;
    margin:0;
    color:#ffffff;
}

/* BLUE ACCENT */
.logo span{
    color:#32c5ff;
}

/* SUBTITLE */
.subtitle{
    margin-top:12px;
    font-size:clamp(13px, 1.8vw, 18px);
    font-weight:500;
    letter-spacing:4px;
    color:#8fa5bd;
}

/* DIVIDER */
.divider{
    width:70px;
    height:3px;
    margin:25px auto;
    border-radius:10px;
    background:#32c5ff;
}

/* MISSION */
.mission{
    color:#d6e1ec;
    font-size:clamp(15px, 1.8vw, 19px);
    line-height:1.9;
}

/* START BUTTON */
.start-btn{
    margin-top:32px;
    padding:16px 38px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    letter-spacing:1px;
    cursor:pointer;
    color:#07111d;
    background:#32c5ff;
    box-shadow:0 8px 25px rgba(50,197,255,.22);
    transition:.25s ease;
}

.start-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(50,197,255,.35);
}

.start-btn:active{
    transform:translateY(0);
}

/* VIDEO SCREEN */
#videoScreen{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
}

#gameVideo{
    width:100%;
    height:100%;
    border:none;
}

/* SKIP BUTTON */
#skipBtn{
    position:absolute;
    top:18px;
    right:18px;
    z-index:100;
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:8px;
    background:rgba(0,0,0,.55);
    color:#ffffff;
    font-size:13px;
    cursor:pointer;
    backdrop-filter:blur(8px);
}

/* FOOTER */
.footer{
    position:absolute;
    bottom:18px;
    color:#63758a;
    font-size:12px;
}
</style>
</head>

<body>

<!-- INTRO SCREEN -->
<div class="intro" id="introScreen">

    <div class="content">

        <div class="icon">⚛️</div>

        <h1 class="logo">
            SCIENCE <span>BLASTER</span>
        </h1>

        <div class="subtitle">
            THE ULTIMATE SCIENCE ADVENTURE
        </div>

        <div class="divider"></div>

        <div class="mission">
            Explore exciting worlds.<br>
            Solve science challenges.<br>
            <strong>Shoot • Answer • Learn • Win!</strong>
        </div>

        <button class="start-btn" onclick="startMission()">
            ▶ START MISSION
        </button>

    </div>

    <div class="footer">
        SCIENCE BLASTER © 2026
    </div>

</div>


<!-- VIDEO SCREEN -->
<div id="videoScreen">

    <button id="skipBtn" onclick="skipIntro()">
        SKIP INTRO ⏭
    </button>

    <iframe
        id="gameVideo"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>


<script>

function startMission(){

    document.getElementById("introScreen").style.display="none";
    document.getElementById("videoScreen").style.display="block";

    /* GANTIKAN VIDEO_ID */
    document.getElementById("gameVideo").src =
    "https://www.youtube.com/embed/6URw9WfnPe4?autoplay=1&mute=0&playsinline=1&rel=0";

}

function skipIntro(){

    window.location.href="game.html";

}

</script>

</body>
</html>
```
